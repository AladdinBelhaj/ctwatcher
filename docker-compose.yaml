services:
  certstream:
    image: 0rickyy0/certstream-server-go:latest
    volumes:
      - ./certstream/config.yaml:/app/config/config.yaml
    ports:
      - "8080:8080"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ctwatcher
      POSTGRES_USER: ctwatcher
      POSTGRES_PASSWORD: ctwatcher
    ports:
      - "5432:5432"